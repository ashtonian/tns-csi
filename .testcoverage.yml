# Coverage ratchet for vladopajic/go-test-coverage (run locally: make coverage-check).
#
# Two gates:
#   1. Floors below: total and per-package minimums. They only ever go UP.
#      When a package's coverage rises, raise its floor to (new value - 1) in the
#      same PR. Never lower a floor; add tests instead.
#   2. Diff vs main (CI only): a PR may not reduce total coverage relative to the
#      latest main build, beyond a 0.5-point noise tolerance (COVERAGE_DIFF_THRESHOLD).
#
# Paired U2 measurement on Linux/arm64, Go 1.26.2:
# total 37.0% -> 38.4%; driver 50.1% -> 50.3%; tnsapi 44.6% -> 50.0%;
# kubectl plugin 5.1% -> 8.0%; driver executable 7.5% -> 14.0%.
# The checker accepts integer thresholds. Prior fractional floors are rounded
# up to preserve their intended minimum; unrelated floors remain unchanged.
# Linux mount coverage requires Linux tests; Darwin uses separate files.

profile: coverage.out

threshold:
  # Per-file floors are not enforced yet (many small files are untested).
  file: 0
  # Packages not listed under override have no floor yet.
  package: 0
  total: 37

override:
  # First match wins, so keep specific paths before general ones.
  - path: ^pkg/driver$
    threshold: 50
  - path: ^pkg/tnsapi$
    threshold: 49
  - path: ^pkg/retry$
    threshold: 92
  - path: ^pkg/metrics$
    threshold: 70
  - path: ^pkg/mount$
    threshold: 57
  - path: ^cmd/kubectl-tns-csi$
    threshold: 7
  - path: ^cmd/tns-csi-driver$
    threshold: 13
  # 10.0% once its query tests landed.
  - path: ^pkg/dashboard$
    threshold: 9

exclude:
  paths:
    - _test\.go$
    - ^tests/
